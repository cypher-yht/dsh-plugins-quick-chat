name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin manifest
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!p.name || !p.version) throw new Error('package.json missing name/version');
            if (!p.dsh) throw new Error('package.json missing dsh field');
            const patch = p.dsh.bundle && p.dsh.bundle.patch;
            if (patch) { fs.accessSync(patch); console.log('patch ok:', patch); }
            console.log('plugin:', p.name, 'v' + p.version);
          "

      - name: Validate JSON resources
        run: |
          node -e "
            const fs = require('fs');
            const dirs = fs.existsSync('locale') ? fs.readdirSync('locale').filter(f => f.endsWith('.json')) : [];
            for (const f of dirs) JSON.parse(fs.readFileSync('locale/' + f, 'utf8'));
            console.log('locale json ok:', dirs.length);
          "

      - name: Run tests if present
        run: |
          if ls test/*.test.mjs >/dev/null 2>&1; then
            node --test test/*.test.mjs
          else
            echo "no tests in this repo, skipped"
          fi